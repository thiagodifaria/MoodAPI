services:
  api:
    image: moodapi-api:local
    build:
      context: ../service-api/service-python
      dockerfile: Dockerfile
    container_name: moodapi-api
    environment:
      MOODAPI_DEBUG: "true"
      MOODAPI_ENVIRONMENT: development
      MOODAPI_LOG_LEVEL: INFO
      MOODAPI_ML__MODEL_NAME: lxyuan/distilbert-base-multilingual-cased-sentiments-student
      MOODAPI_DATABASE__URL: postgresql+psycopg2://moodapi:moodapi@postgres:5432/moodapi
      MOODAPI_CACHE__URL: redis://redis:6379/0
      MOODAPI_RATE_LIMIT__ENABLED: "true"
      MOODAPI_OTEL__ENABLED: "true"
      MOODAPI_OTEL__SERVICE_NAME: moodapi
      MOODAPI_OTEL__EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MOODAPI_QUEUE__ENABLED: "true"
      MOODAPI_QUEUE__BROKER_URL: amqp://moodapi:moodapi@rabbitmq:5672//
      MOODAPI_QUEUE__RESULT_BACKEND: redis://redis:6379/1
      MOODAPI_STREAMING__ENABLED: "true"
      MOODAPI_STREAMING__BOOTSTRAP_SERVERS: redpanda:9092
      MOODAPI_VECTOR__ENABLED: "true"
      MOODAPI_VECTOR__URL: http://qdrant:6333
      MOODAPI_VECTOR__COLLECTION_NAME: moodapi_sentiments_v2
      MOODAPI_VECTOR__EMBEDDING_MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      MOODAPI_VECTOR__SEARCH_SCORE_THRESHOLD: "0.35"
    volumes:
      - ../service-api/service-python/models:/app/models
      - ../service-api/service-python/data:/app/data
      - ../service-api/service-postgresql:/service-postgresql:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: moodapi-frontend:local
    build:
      context: ../client-web
      dockerfile: Dockerfile
    container_name: moodapi-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: moodapi-postgres
    environment:
      POSTGRES_DB: moodapi
      POSTGRES_USER: moodapi
      POSTGRES_PASSWORD: moodapi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodapi -d moodapi"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: moodapi-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: moodapi-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: moodapi
      RABBITMQ_DEFAULT_PASS: moodapi
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    container_name: moodapi-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: moodapi-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  celery-worker:
    image: moodapi-api:local
    build:
      context: ../service-api/service-python
      dockerfile: Dockerfile
    container_name: moodapi-celery-worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --queues=sentiment.analysis
    environment:
      MOODAPI_ENVIRONMENT: development
      MOODAPI_ML__MODEL_NAME: lxyuan/distilbert-base-multilingual-cased-sentiments-student
      MOODAPI_DATABASE__URL: postgresql+psycopg2://moodapi:moodapi@postgres:5432/moodapi
      MOODAPI_CACHE__URL: redis://redis:6379/0
      MOODAPI_QUEUE__ENABLED: "true"
      MOODAPI_QUEUE__BROKER_URL: amqp://moodapi:moodapi@rabbitmq:5672//
      MOODAPI_QUEUE__RESULT_BACKEND: redis://redis:6379/1
      MOODAPI_VECTOR__ENABLED: "true"
      MOODAPI_VECTOR__URL: http://qdrant:6333
      MOODAPI_VECTOR__COLLECTION_NAME: moodapi_sentiments_v2
      MOODAPI_VECTOR__EMBEDDING_MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      MOODAPI_VECTOR__SEARCH_SCORE_THRESHOLD: "0.35"
    volumes:
      - ../service-api/service-python/models:/app/models
      - ../service-api/service-python/data:/app/data
      - ../service-api/service-postgresql:/service-postgresql:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  stream-worker:
    image: moodapi-api:local
    build:
      context: ../service-api/service-python
      dockerfile: Dockerfile
    container_name: moodapi-stream-worker
    command: python -m app.streaming.consumer
    environment:
      MOODAPI_ENVIRONMENT: development
      MOODAPI_ML__MODEL_NAME: lxyuan/distilbert-base-multilingual-cased-sentiments-student
      MOODAPI_DATABASE__URL: postgresql+psycopg2://moodapi:moodapi@postgres:5432/moodapi
      MOODAPI_CACHE__URL: redis://redis:6379/0
      MOODAPI_STREAMING__ENABLED: "true"
      MOODAPI_STREAMING__BOOTSTRAP_SERVERS: redpanda:9092
      MOODAPI_VECTOR__ENABLED: "true"
      MOODAPI_VECTOR__URL: http://qdrant:6333
      MOODAPI_VECTOR__COLLECTION_NAME: moodapi_sentiments_v2
      MOODAPI_VECTOR__EMBEDDING_MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      MOODAPI_VECTOR__SEARCH_SCORE_THRESHOLD: "0.35"
    volumes:
      - ../service-api/service-python/models:/app/models
      - ../service-api/service-python/data:/app/data
      - ../service-api/service-postgresql:/service-postgresql:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: moodapi-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: moodapi-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: moodapi-otel
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./otel/collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  redpanda_data:
  qdrant_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: moodapi-network
